apiVersion: v1
kind: ServiceAccount
metadata:
  name: cms-labs-checker
  namespace: cms-labs-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cms-labs-checker-demo
  namespace: LAB_NAMESPACE
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cms-labs-checker-demo
  namespace: LAB_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cms-labs-checker-demo
subjects:
  - kind: ServiceAccount
    name: cms-labs-checker
    namespace: cms-labs-system
