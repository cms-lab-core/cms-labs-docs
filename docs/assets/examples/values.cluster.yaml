releasePrefix: "-"
defaultImagePullPolicy: IfNotPresent

generic:
  labels:
    app.kubernetes.io/part-of: cms-labs
  usePredefinedAffinity: false

services:
  backend:
    extraSelectorLabels: {app.kubernetes.io/component: backend}
    ports:
      - {name: http, port: 5000, targetPort: http}
  clabgate:
    extraSelectorLabels: {app.kubernetes.io/component: clabgate}
    ports:
      - {name: http, port: 80, targetPort: http}
  frontend:
    extraSelectorLabels: {app.kubernetes.io/component: frontend}
    ports:
      - {name: http, port: 80, targetPort: http}

deployments:
  backend:
    extraSelectorLabels: {app.kubernetes.io/component: backend}
    containers:
      - name: backend
        image: ghcr.io/cms-lab-core/cms-labs-api/backend
        imageTag: "1.20.5"
        ports:
          - {name: http, containerPort: 5000}
        envFrom:
          - secretRef: {name: cms-backend-env}
        env:
          - {name: STAGE_STATUS, value: prod}
          - {name: SERVER_HOST, value: 0.0.0.0}
          - {name: SERVER_PORT, value: "5000"}
          - {name: SERVER_READ_TIMEOUT, value: "60"}
          - {name: LAB_CATALOG_ENABLED, value: "true"}
          - {name: JWT_SECRET_KEY_EXPIRE_MINUTES_COUNT, value: "60"}
          - {name: JWT_REFRESH_KEY_EXPIRE_HOURS_COUNT, value: "24"}
          - name: JWT_SECRET_KEY_PRIVATE
            valueFrom: {secretKeyRef: {name: cms-jwt, key: private.pem}}
          - name: JWT_SECRET_KEY_PUBLIC
            valueFrom: {secretKeyRef: {name: cms-jwt, key: public.pem}}
          - name: JWT_REFRESH_KEY_PRIVATE
            valueFrom: {secretKeyRef: {name: cms-jwt, key: private.pem}}
          - name: JWT_REFRESH_KEY_PUBLIC
            valueFrom: {secretKeyRef: {name: cms-jwt, key: public.pem}}
        readinessProbe:
          tcpSocket: {port: http}

  clabgate:
    replicas: 2
    serviceAccountName: clabgate
    extraSelectorLabels: {app.kubernetes.io/component: clabgate}
    containers:
      - name: clabgate
        image: ghcr.io/cms-lab-core/cms-labs-api/clabgate
        imageTag: "1.20.5"
        ports:
          - {name: http, containerPort: 8080}
        envFrom:
          - secretRef: {name: cms-clabgate-env}
        env:
          - {name: STAGE_STATUS, value: prod}
          - {name: SERVER_HOST, value: 0.0.0.0}
          - {name: SERVER_PORT, value: "8080"}
          - {name: SERVER_READ_TIMEOUT, value: "60"}
          - {name: CMS_URL, value: "http://backend.{{ .Release.Namespace }}.svc.cluster.local:5000"}
          - {name: WORKSPACE_COOKIE_SECURE, value: "true"}
          - {name: CHECKER_SERVICE_ACCOUNT, value: cms-labs-checker}
          - name: JWT_SECRET_KEY_PUBLIC
            valueFrom: {secretKeyRef: {name: cms-jwt, key: public.pem}}
          - name: POD_NAMESPACE
            valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          - name: POD_NAME
            valueFrom: {fieldRef: {fieldPath: metadata.name}}
        readinessProbe:
          httpGet: {path: /clabgate/api/docs/index.html, port: http}

  frontend:
    extraSelectorLabels: {app.kubernetes.io/component: frontend}
    containers:
      - name: frontend
        image: ghcr.io/cms-lab-core/cms-labs-api/frontend
        imageTag: "1.20.5"
        ports:
          - {name: http, containerPort: 80}
        envFrom:
          - configMapRef: {name: cms-frontend-env}
        env:
          - {name: CMS_CORE_SERVICE, value: "http://backend.{{ .Release.Namespace }}.svc.cluster.local:5000"}
          - {name: CLABGATE_SERVICE, value: "http://clabgate.{{ .Release.Namespace }}.svc.cluster.local:80"}
          - {name: SSL_CONF, value: ""}
        readinessProbe:
          httpGet: {path: /, port: http}

serviceAccount:
  clabgate:
    clusterRole:
      name: clabgate
      rules:
        - {apiGroups: ["c9s.run"], resources: ["topologies"], verbs: ["get", "list", "create", "update", "patch", "delete"]}
        - {apiGroups: ["apps"], resources: ["deployments"], verbs: ["get", "list", "create", "update", "patch", "delete"]}
        - {apiGroups: [""], resources: ["namespaces", "pods", "pods/exec", "services", "persistentvolumeclaims", "configmaps", "serviceaccounts"], verbs: ["get", "list", "create", "update", "patch", "delete"]}
        - {apiGroups: [""], resources: ["pods/log"], verbs: ["get"]}
        - {apiGroups: ["batch"], resources: ["jobs"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]}
        - {apiGroups: ["coordination.k8s.io"], resources: ["leases"], verbs: ["get", "list", "watch", "create", "update", "patch"]}
        - {apiGroups: ["rbac.authorization.k8s.io"], resources: ["roles", "rolebindings"], verbs: ["get", "list", "create", "update", "patch", "delete"]}
        - {apiGroups: ["networking.k8s.io"], resources: ["networkpolicies"], verbs: ["get", "list", "create", "update", "patch", "delete"]}
  cms-labs-checker:
    clusterRole:
      name: cms-labs-checker
      rules:
        - {apiGroups: ["apps"], resources: ["deployments"], verbs: ["get"]}
        - {apiGroups: [""], resources: ["pods"], verbs: ["get", "list"]}
        - {apiGroups: [""], resources: ["pods/exec", "pods/attach"], verbs: ["get", "create"]}

cronJobs:
  grade-sync:
    schedule: "*/5 * * * *"
    singleOnly: true
    backoffLimit: 3
    containers:
      - name: grade-sync
        image: ghcr.io/cms-lab-core/cms-labs-api/backend
        imageTag: "1.20.5"
        args: ["--task=grade_sync"]
        envFrom:
          - secretRef: {name: cms-backend-env}
        env:
          - name: JWT_SECRET_KEY_PRIVATE
            valueFrom: {secretKeyRef: {name: cms-jwt, key: private.pem}}
          - name: JWT_SECRET_KEY_PUBLIC
            valueFrom: {secretKeyRef: {name: cms-jwt, key: public.pem}}
          - name: JWT_REFRESH_KEY_PRIVATE
            valueFrom: {secretKeyRef: {name: cms-jwt, key: private.pem}}
          - name: JWT_REFRESH_KEY_PUBLIC
            valueFrom: {secretKeyRef: {name: cms-jwt, key: public.pem}}
