apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cms-labs
  namespace: cms-labs-system
spec:
  ingressClassName: nginx
  tls:
    - hosts: [cms.example.org]
      secretName: cms-labs-tls
  rules:
    - host: cms.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
